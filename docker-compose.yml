services:
  db:
    image: postgres:16
    container_name: review-db
    environment:
      POSTGRES_DB: review_analysis
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review_local_pw
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - review-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review_analysis"]
      interval: 5s
      retries: 10

volumes:
  review-pgdata: