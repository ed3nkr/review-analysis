spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/review_analysis
    username: review
    password: review_local_pw

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  analysis-server-url: http://localhost:8000
  upload-dir: ./uploads